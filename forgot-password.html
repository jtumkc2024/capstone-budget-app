<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .error { color: red; }
    </style>
</head>
<body style = "background-color:#F5F5F5">
    <div class="container-fluid" style="background-color: #156e41; margin-bottom:20px; height:80px">
    	<ul class="nav justify-content-center">
		<li><h2 style="color:white; margin-top:20px">Smarter Save</h2><li>
    	</ul>
    </div>
    <h3 class="text-center">Forgot Password</h3>
    <form class="text-center" id="forgotPasswordForm" action="/forgot-password" method="post">
        <div style="margin-top:15px">
            <strong><label for="username">Username:</label></strong>
            <input type="text" id="username" name="username">
            <span id="usernameError" class="error"></span>
        </div>
        <div style="margin-top:15px">
            <a href="login.html" target="_self"><input class="btn btn-secondary" type="button" value="Back to Login"></a>
            <button class="btn btn-info" type="submit" id="submit" name="submit">Send Password Reset</button>
        </div>
    </form>

    <script src="forgot-password-script.js"></script>
</body>
</html>
