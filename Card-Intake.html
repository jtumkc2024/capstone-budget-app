<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add a Card</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Style for error messages */
        .error {
            color: red;
            font-size: 0.9em;
        }
        
        .error-input {
            border-color: red;
        }
       
        label {
            display: block;
            margin-top: 10px;
        }
        
        input {
            margin-bottom: 10px;
        }
    </style>
</head>
<body style="background-color: #F5F5F5">
    <nav class="navbar" style="background-color:#156e41">
	<div class="container-fluid">
	    <a class="navbar-brand" href="dashboard.html" target="_self" style="color:white"><h3>Back</h3></a>
	    <h3 style="margin-right:45%; color:white">Add A Card</h3>
	</div>
    </nav>
    <nav aria-label="breadcrumb" style="margin:20px">
	<strong><ol class="breadcrumb">
	    <li class="breadcrumb-item"><a href="dashboard.html">Home</a></li>
	    <li class="breadcrumb-item active" aria-current="page">Add a Card</li>
	</ol></strong>
    </nav>

    <h4 class="text-center">Add a Card</h4>
    <!-- Form to add a card -->
    <form class="text-center" id="addCardForm">
        <!-- Name on Card field -->
        <label for="cardName" class="form-label">Name on Card</label>
        <input type="text" class="form-control" id="cardName" name="cardName" placeholder="Cardholder Name" style="width:50%; margin-left:25%">
        <span class="error" id="cardNameError"></span>

        <!-- Card Number field -->
        <label for="cardNumber" class="form-label">Card Number</label>
        <input type="text" class="form-control" id="cardNumber" name="cardNumber" placeholder="1234 5678 9012 3456" style="width:50%; margin-left:25%">
        <span class="error" id="cardNumberError"></span>

        <!-- Expiration Date field -->
        <label for="expiryDate" class="form-label">Expiration Date (MM/YY)</label>
        <input type="text" class="form-control" id="expiryDate" name="expiryDate" placeholder="MM/YY" style="width:50%; margin-left:25%">
        <span class="error" id="expiryDateError"></span>

        <!-- Security Code field -->
        <label for="securityCode" class="form-label">Security Code</label>
        <input type="text" class="form-control" id="securityCode" name="securityCode" placeholder="CVV" style="width:50%; margin-left:25%">
        <span class="error" id="securityCodeError"></span>

	<br>

        <!-- Add and Cancel buttons -->
	<div style="margin-top:15px">
            <a href = "dashboard.html" target = "_self"><button class="btn btn-secondary" type="button">Cancel</button></a>
            <button class="btn btn-info" type="submit">Add</button>
	</div>
    </form>
    <script src="add-cardscript.js"></script>
</body>
</html>
