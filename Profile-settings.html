<DOCTYPE! html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name = "viewport" content = "width = devide-width, initial-scale = 1.0">
    <title>User Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
	.error {
		color: red;
	}
        .profile-pic-option {
            border: 2px solid transparent;
            cursor: pointer;
            border-radius: 50%;
            width: 100px;
            height: 100px;
            display: none; /* Hide options initially */
        }
        .selected {
            border-color: #156e41;
        }
        #picture-options {
            display: none; /* Initially hidden */
        }
    </style>

</head>

<body style = "background-color: #F5F5F5">
    <nav class="navbar" style="background-color:#156e41">
	<div class="container-fluid">
	    <a class="navbar-brand" href="dashboard.html" target="_self" style="color:white"><h3>Back</h3></a>
	    <h3 style="margin-right:45%; color:white">Profile Settings</h3>
	</div>
    </nav>
    <nav aria-label="breadcrumb" style="margin:20px">
	<strong><ol class="breadcrumb">
	    <li class="breadcrumb-item"><a href="dashboard.html">Home</a></li>
	    <li class="breadcrumb-item active" aria-current="page">Settings</li>
	</ol></strong>
    </nav>
    <div id="profile-picture" class="text-center">
        <img id="mainProfilePicture" src="profile-picture-1.jpg" alt="Profile Picture" style="border-radius:50%; height:200px; width:200px;">
    </div>

    <div class="text-center">
        <button class="btn btn-secondary" type="button" style="margin-top: 20px;" onclick="togglePictureOptions()">Change Picture</button>
    </div>

    <div id="picture-options" class="d-flex justify-content-center mt-4"> 
        <img src="profile-picture-1.jpg" alt="Profile Option 1" class="profile-pic-option" onclick="selectPicture(this)"> 
        <img src="profile-picture-2.jpg" alt="Profile Option 2" class="profile-pic-option mx-3" onclick="selectPicture(this)">
        <img src="profile-picture-3.jpg" alt="Profile Option 3" class="profile-pic-option mx-3" onclick="selectPicture(this)">
        <img src="profile-picture-4.jpg" alt="Profile Option 4" class="profile-pic-option" onclick="selectPicture(this)">
    </div>


    <div class="d-flex justify-content-center" style="margin-top:20px">
        <form id="passwordChange" class="text-center">
            <label for="password" class="form-label">New Password</label><br>
            <input class="form-control" type = "password" id = "password" name = "password" style="width:50%; margin-left:25%">
	    <span id="passwordError" class="error"></span><br>
		
            <label for="confirmPassword" class="form-label">Confirm Password</label><br>
            <input class="form-control" type = "password" id = "confirmPassword" name = "confirmPassword" style="width:50%; margin-left:25%">
	    <span id="confirmPasswordError" class="error"></span><br>
        <div>
            <ul>
                <li>The password must be 8 characters in length.</li>
                <li>The password must contain a number.</li>
                <li>The password must contain a special character.</li>
                <li>The password must contain an uppercase letter.</li>
            </ul>
        </div>
            <button class="btn btn-info" type = "submit" style = "margin-top:10px">Change Password</button>
        </form>
    </div>
	<script src = "profile-settings.js"></script>
</body>
</html>
