<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <style>
        .error { color: red; }
    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- <script type="text/javascript" src="SQLStatements.js"></script> -->
</head>
<body style = "background-color: #F5F5F5">
    <div class = "container-fluid" style="background-color: #156e41; margin-bottom:20px; height:80px">
	<ul class="nav justify-content-center">
	    <li><h2 style="color:white; margin-top:20px">Smarter Save</h2></li>
	</ul>
    </div>
    <h2 class="text-center" style="margin-bottom:20px">Register</h2>
    <form id="registerForm" class="text-center">
        <div style="margin-bottom:15px">
            <strong><label for="username">Username</label></strong>
            <input type="text" id="username" name="username">
            <span id="usernameError" class="error"></span>
        </div>

        <div style="margin-bottom:15px">
            <strong><label for="email">Email</label></strong>
            <input type="email" id="email" name="email">
            <span id="emailError" class="error"></span>
        </div>

        <div style="margin-bottom:15px">
            <strong><label for="password">Password</label></strong>
            <input type="password" id="password" name="password">
            <span id="passwordError" class="error"></span>
        </div>

        <div style="margin-bottom:15px">
            <strong><label for="confirmpassword">Confirm Password</label></strong>
            <input type="password" id="confirmpassword" name="confirmpassword">
            <span id="confirmPasswordError" class="error"></span>
        </div>

        <div>
	    <strong>
                <p>The password must be 8 characters in length.</p>
                <p>The password must contain a number.</p>
                <p>The password must contain a special character.</p>
                <p>The password must contain an uppercase letter.</p>
	    </strong>
        </div>

        <div>
            <a href="login.html" target="_self"><input class="btn btn-secondary" type="button" value="Back to Login"></a>
            <button class="btn btn-info" type="submit" id="submit" name="submit">Register</button>
        </div>
    </form>

    <script src="register-script.js"></script>
</body>
</html>
