<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .error { color: red; }
    </style>

</head>

<body style = "background-color:#F5F5F5">
    <div class="container-fluid" style="background-color: #156e41; margin-bottom:20px; height:80px">
    	<ul class="nav justify-content-center">
		<li><h2 style="color:white; margin-top:20px">Smarter Save</h2><li>
    	</ul>
    </div>
    <h4 class="text-center" style="margin-bottom:20px">Welcome to Smarter Save! Your one-stop shop for learning to budget!</h2>
    <form id="loginForm">
        <div class="text-center" style="margin-bottom:15px">
            <strong><label for="username">Username</label></strong>
            <input type="text" id="username" name="username">
            <span id="usernameError" class="error"></span>
        </div>
        <div class="text-center" style="margin-bottom:15px">
            <strong><label for="password">Password</label></strong>
            <input type="password" id="password" name="password">
            <span id="passwordError" class="error"></span>
        </div>
        <div class="text-center" style="margin-bottom:15px">
            <p><strong><a href="forgot-password.html" target="_self">Forgot password?</a></strong></p>
        </div>
        <div class="text-center">
            <a href="register.html" target="_self"><input class = "btn btn-secondary" type="button" value="Register"></a>
            <button class = "btn btn-info" type="submit" id="submit" name="submit">Login</button>
        </div>
    </form>
    <script src = 'login-script.js'></script>

</body>
</html>
